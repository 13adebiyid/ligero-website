<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" sizes="64x64" href="/images/ligero-browser-icon.png">
    <link rel="shortcut icon" href="/images/ligero-browser-icon.png">
    <link rel="apple-touch-icon" sizes="64x64" href="/images/ligero-browser-icon.png">
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="preload" href="/js/script.js" as="script">
    <script src="/js/script.js" defer></script>
</head>
<body class="coming-soon-page">

<!-- Navigation -->
<nav>
    <div class="hamburger-menu">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
    </div>

    <a href="/" class="logo">LIGERO</a>

    <div class="nav-menu">
        <a href="/shop/" class="nav-item">Shop</a>
        <span class="nav-separator">|</span>
        <a href="/services/" class="nav-item">Services</a>
        <span class="nav-separator">|</span>
        <a href="/contact/" class="nav-item">Contact</a>
        <span class="nav-separator">|</span>
        <a href="/policies/" class="nav-item">Policies</a>
    </div>
</nav>

<!-- Mobile Menu -->
<div class="mobile-menu-overlay">
    <a href="/" class="mobile-menu-item">HOME</a>
    <a href="/shop/" class="mobile-menu-item">SHOP</a>
    <a href="/services/" class="mobile-menu-item">SERVICES</a>
    <a href="/contact/" class="mobile-menu-item">CONTACT</a>
    <a href="/policies/" class="mobile-menu-item">POLICIES</a>
</div>

<!-- Contact Coming Soon Section -->
<div class="coming-soon-container">
    <h1 class="coming-soon-title">we're still polishing our dedicated submission form</h1>
    <p class="coming-soon-subtitle">in the meantime shoot our<br>spokesperson a dm</p>

    <div class="instagram-container">
        <a href="https://www.instagram.com/itsjustk1d/" target="_blank" rel="noopener noreferrer">
            <img src="/images/white-instagram-icon.png" alt="Instagram" id="instagram-icon" class="instagram-icon" />
        </a>
    </div>
</div>

<!-- Theme Switcher -->
<div class="theme-switcher">
    <div class="theme-circle black" onclick="setTheme('black')"></div>
    <div class="theme-circle white" onclick="setTheme('white')"></div>
</div>

<!-- Optional Instagram Icon Switcher Script -->
<script>
    const switchIcon = (theme) => {
        const icon = document.getElementById('instagram-icon');
        icon.src = theme === 'white' ? '/images/black-instagram-icon.png' : '/images/white-instagram-icon.png';
    };

    document.querySelectorAll('.theme-circle').forEach(circle => {
        circle.addEventListener('click', () => switchIcon(circle.dataset.theme));
    });

    // Initial icon setup (based on saved theme)
    try {
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) switchIcon(currentTheme);
    } catch (e) {}
</script>
</body>
</html>
