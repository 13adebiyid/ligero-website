<!-- Services Page -->
<div class="services-page" id="services-page">
  <div class="theme-switcher">
    <div class="theme-circle black" onclick="setTheme('black')"></div>
    <div class="theme-circle white" onclick="setTheme('white')"></div>
  </div>
  <h1 class="services-title">OUR CAPABILITIES</h1>

  <iframe id="services-gallery" src="/services/gallery/" title="Explore Ligero services" loading="eager"></iframe>
  <script>
    const servicePaths = Object.freeze({
      'creative-directing': '/services/creative-directing.html',
      'set-designing': '/services/set-designing.html',
      photography: '/services/photography.html',
      models: '/services/models.html',
      music: '/services/music/',
      styling: '/services/styling.html'
    });
    window.addEventListener('message', event => {
      const frame = document.getElementById('services-gallery');
      if (event.origin === location.origin && event.source === frame.contentWindow &&
          event.data?.type === 'ligero:service-select' &&
          Object.hasOwn(servicePaths, event.data?.slug)) {
        window.LigeroNavigation.navigate(servicePaths[event.data.slug]);
      }
    });
  </script>
</div>
